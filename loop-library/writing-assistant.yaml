# LSS 1.0 — Writing Assistant Loop
# Taxonomy Level 2 (Reflective): draft → critique → revise with fact-check

loop_name: writing-assistant
version: "1.0"

objective: >
  Produce publication-ready long-form content that meets style, structure, and
  factual accuracy requirements through iterative drafting and multi-channel review.

inputs:
  - name: brief
    type: object
    required: true
    properties: [topic, audience, tone, length_words, thesis]
  - name: style_guide
    type: object
    properties: [voice, forbidden_phrases, citation_format]
  - name: fact_check_policy
    type: enum
    values: [light, standard, rigorous]
    default: standard
  - name: research_artifacts
    type: array
    items: uri
    required: false
  - name: outline_required
    type: boolean
    default: true

memory:
  episodic:
    backend: draft_versions
    retention: session
    stores: [outline, drafts_v1_n, edit_comments, fact_check_notes]
  semantic:
    backend: fact_registry
    retention: persistent
    stores: [verified_claims, disputed_claims, source_snippets]
  procedural:
    backend: style_profiles
    retention: persistent
    stores: [audience_templates, transition_patterns, headline_formulas]

workers:
  - id: outliner
    role: planner
    model: claude-sonnet-4-6
    temperature: 0.3
    responsibilities:
      - Produce section outline aligned to thesis and length budget
      - Allocate word counts per section
  - id: drafter
    role: author
    model: claude-opus-4-8
    temperature: 0.6
    responsibilities:
      - Write sections sequentially following outline
      - Maintain voice consistency per style_guide
  - id: editor
    role: critic
    model: gpt-4.1
    temperature: 0.2
    responsibilities:
      - Line-edit for clarity, rhythm, and redundancy
      - Flag structural issues and weak arguments
  - id: fact_checker
    role: verifier
    model: gpt-4.1-mini
    temperature: 0.0
    tools: [web_search, research_artifacts]
    responsibilities:
      - Verify factual claims per fact_check_policy
      - Insert citations or mark claims for removal

evaluators:
  - id: style_rubric
    type: llm_rubric
    dimensions: [voice_match, clarity, engagement, structure]
    pass_threshold: 0.88
  - id: length_budget
    type: metric
    metric: word_count
    operator: within_percent
    value: 10
    target: "${inputs.brief.length_words}"
  - id: fact_accuracy
    type: oracle
    method: claim_verification_rate
    pass_threshold: 0.98
  - id: plagiarism_scan
    type: command
    method: ngram_similarity
    max_overlap: 0.15

feedback_channels:
  - from: editor
    to: drafter
    signal: revision_notes
    action: section_rewrite
  - from: fact_checker
    to: drafter
    signal: unsupported_claims
    action: revise_or_cite
  - from: style_rubric
    to: editor
    signal: low_dimension_scores
    action: targeted_pass
  - from: outliner
    to: drafter
    signal: structural_drift
    action: realign_sections

optimization_strategy:
  type: hierarchical_revision
  parameters:
    outline_lock_after_approval: true
    max_full_draft_rewrites: 2
    section_level_iterations: 4

termination_conditions:
  - type: all_evaluators_pass
    evaluators: [style_rubric, length_budget, fact_accuracy, plagiarism_scan]
  - type: max_iterations
    value: 10
  - name: author_acceptance
    type: human_gate
    required: false
  - type: budget_exhausted
    resource: cost_limits.max_usd

metrics:
  - name: revision_efficiency
    formula: final_style_score / edit_rounds
  - name: fact_check_yield
    formula: verified_claims / total_factual_claims
  - name: readability_score
    method: flesch_kincaid
    target: audience_calibrated
  - name: time_to_publishable
    unit: minutes

safety_constraints:
  - id: defamation_guard
    rule: Flag unverified negative claims about identifiable individuals
  - id: copyright
    rule: No large verbatim copying; plagiarism_scan must pass
  - id: sensitive_topics
    rule: Health/legal/financial content includes disclaimer block
  - id: disclosure
    rule: AI-assisted drafting disclosed when inputs.require_disclosure true

cost_limits:
  max_usd: 6.00
  max_tokens: 300000
  max_wall_clock_seconds: 3600
