[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "le-loop-stack"
version = "0.1.0"
description = "One-line install for Loop Engineering — loopforge, loopctl, and LoopGym"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Loop Engineering Community" }]
keywords = ["loop-engineering", "lss", "agents", "meta-package"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "le-loopforge>=0.2.1",
    "le-loopctl>=0.2.0",
    "loopgym>=0.1.2",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2.0"]
crewai = ["crewai>=0.1.0"]
bench = ["loopbench>=0.1.1"]
all = ["langgraph>=0.2.0", "crewai>=0.1.0", "loopbench>=0.1.1"]

[project.urls]
Homepage = "https://github.com/KanakMalpani/Loop-Engineering"
Documentation = "https://github.com/KanakMalpani/Loop-Engineering/blob/main/contributions/GOLDEN_PATH.md"
Repository = "https://github.com/KanakMalpani/Loop-Engineering/tree/main/stack"

[tool.setuptools]
packages = []
