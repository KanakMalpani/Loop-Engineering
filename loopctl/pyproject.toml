[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loopctl"
version = "0.1.0"
description = "Unified CLI for Loop Engineering — validate, score, trace, level"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Loop Engineering Community" }]
dependencies = [
    "loopforge>=0.2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.scripts]
loopctl = "loopctl.cli:main"

[project.urls]
Homepage = "https://github.com/KanakMalpani/Loop-Engineering"
Repository = "https://github.com/KanakMalpani/Loop-Engineering"

[tool.setuptools]
package-dir = { "loopctl" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["loopctl*"]

[tool.setuptools.package-data]
loopctl = ["schemas/*.json"]
