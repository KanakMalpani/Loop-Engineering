loop_name: research-agent
version: 1.0.0

objective: >
  Produce a sourced research brief with traceable citations and explicit uncertainty.
  Achieve primary_quality >= 0.80 within cost_limits with zero safety violations.

inputs:
  schema:
    task:
      type: string
      description: "Primary task description or repository context"
      required: true
  examples:
    - task: "Complete the declared objective for this loop profile."

memory:
  type: ephemeral

workers:
  - id: researcher
    role: "Synthesize literature and produce a cited research brief"
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0.2
    inputs:
      - from: inputs.task
    outputs:
      name: Result
      format: text
    timeout_seconds: 120
    retries: 1
    cost_budget_usd: 0.25

evaluators:
  - id: quality_rubric
    type: llm_rubric
    runs_after: [researcher]
    rubric:
      dimensions:
        - name: effectiveness
          weight: 0.6
          scale: [0, 1]
          criteria: "Output meets the stated objective"
        - name: robustness
          weight: 0.4
          scale: [0, 1]
          criteria: "Output is complete and actionable"
      pass_threshold: 0.80
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0

feedback_channels:
  - id: quality_to_worker
    source: evaluators.quality_rubric
    destination: workers.researcher
    format: structured
    fields: [failure_codes, dimension_scores, remediation_hints]
    max_tokens: 400
    when: "score < pass_threshold"
  - id: quality_to_optimizer
    source: evaluators.quality_rubric
    destination: optimization_strategy.prompt_refinement
    format: structured
    fields: [failure_codes, remediation_hints]
    max_tokens: 200

optimization_strategy:
  type: prompt_refinement
  max_steps: 8
  config:
    refinement_target: workers.researcher
  rollback:
    on_metric_drop: 0.05
    on_safety_failure: true

termination_conditions:
  success:
    - metric: primary_quality
      operator: gte
      value: 0.80
      consecutive: 1
  failure:
    - type: safety_violation
      action: halt
    - type: max_iterations
      value: 10
      action: halt
  stall:
    - metric: primary_quality
      window_iterations: 3
      min_improvement: 0.03
      action: halt

metrics:
  - name: primary_quality
    primary: true
    definition: "Weighted score from quality_rubric evaluator"
    source: evaluators.quality_rubric
    unit: ratio
    target: 0.80
    regression_threshold: 0.05
  - name: cost_usd
    definition: "Total API spend per loop run"
    source: telemetry.cost
    unit: usd
    target: 0.50

safety_constraints:
  - id: injection-guard
    type: injection_detect
    scope: pre_worker
    applies_to: [researcher]
    action: quarantine
    severity: S1
    on_error: halt
    config:
      max_risk_score: 0.7

cost_limits:
  per_iteration_usd: 0.20
  cumulative_usd: 1.00
  token_soft_cap: 12000
  on_approach:
    threshold_percent: 80
    action: warn
  on_exceed:
    action: halt

metadata:
  taxonomy_level: 2
  les_estimate: 78
  tags: [loop-library, level-2]
  migrated: "2026-06-17 LSS 1.0 schema compliance"
