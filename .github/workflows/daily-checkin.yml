name: Daily check-in

on:
  schedule:
    # 14:00 UTC every day
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "loopgym>=0.1.2" pyyaml jsonschema
          pip install -e ./loopforge
          pip install -e ./loopctl --no-deps

      - name: Run daily health check
        id: check
        run: |
          python scripts/daily_checkin.py \
            --output docs/checkins/latest.md \
            --archive docs/checkins/archive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}

      - name: Commit check-in log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/checkins/ docs/adoption-tracker/
          if git diff --staged --quiet; then
            echo "No check-in changes to commit"
          else
            git commit -m "Daily check-in $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open or update failure issue
        if: steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = `Daily check-in failed — ${new Date().toISOString().slice(0, 10)}`;
            const body = fs.readFileSync('docs/checkins/latest.md', 'utf8')
              + '\n\n---\n[View workflow run](' + context.payload.repository.html_url
              + '/actions/runs/' + context.runId + ')';
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 20,
            });
            const existing = issues.find(i => i.title.startsWith('Daily check-in failed'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: '**Recurring failure**\n\n' + body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['ci'],
              });
            }

      - name: Fail job if checks failed
        if: steps.check.outcome == 'failure'
        run: exit 1
