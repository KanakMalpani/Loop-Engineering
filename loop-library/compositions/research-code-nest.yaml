loop_name: research-code-nest
version: 1.0.0
objective: 'Research a technical approach then nest coding-agent to produce a verified prototype implementation.
  Achieve composite_quality >= 0.86 within cost_limits.

  '
inputs:
  schema:
    task:
      type: string
      description: Top-level task for the composed pipeline
      required: true
  examples:
  - task: Run the composed loop pipeline on this objective.
memory:
  type: ephemeral
workers:
- id: orchestrator
  role: Route work across composed child loops and merge stage outputs
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  inputs:
  - from: inputs.task
  outputs:
    name: OrchestratorOutput
    format: text
  timeout_seconds: 180
  retries: 1
  cost_budget_usd: 0.5
evaluators:
- id: composite_gate
  type: llm_rubric
  runs_after:
  - orchestrator
  rubric:
    dimensions:
    - name: pipeline_quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: All child loop stages met their pass thresholds
    pass_threshold: 0.86
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
feedback_channels:
- id: composite_to_orchestrator
  source: evaluators.composite_gate
  destination: workers.orchestrator
  format: structured
  fields:
  - failure_codes
  - dimension_scores
  - remediation_hints
  max_tokens: 600
  when: score < pass_threshold
optimization_strategy:
  type: prompt_refinement
  max_steps: 16
  config:
    refinement_target: workers.orchestrator
  rollback:
    on_metric_drop: 0.05
    on_safety_failure: true
termination_conditions:
  success:
  - metric: composite_quality
    operator: gte
    value: 0.86
    consecutive: 1
  failure:
  - type: safety_violation
    action: halt
  - type: max_iterations
    value: 16
    action: halt
metrics:
- name: composite_quality
  primary: true
  definition: Product of child stage quality scores
  source: evaluators.composite_gate
  unit: ratio
  target: 0.86
- name: cost_usd
  definition: Cumulative spend across all child loops
  source: telemetry.cost
  unit: usd
  target: 4.5
safety_constraints:
- id: composition-guard
  type: injection_detect
  scope: pre_worker
  applies_to:
  - orchestrator
  action: quarantine
  severity: S1
  on_error: halt
cost_limits:
  per_iteration_usd: 0.47
  cumulative_usd: 7.5
  token_soft_cap: 20000
  on_exceed:
    action: halt
composition:
  type: nested
  children:
  - id: research
    ref: ../research-agent.yaml
    role: outer
  - id: implement
    ref: ../coding-agent.yaml
    role: inner
    trigger: children.research.evaluators.coherence_rubric.passed
  adapters:
  - from: children.research.outputs.synthesizer
    to: children.implement.inputs.task
metadata:
  taxonomy_level: 4
  les_estimate: 84
  composition_type: nested
  child_loops:
  - research
  - implement
  schema_version: '1.1'
