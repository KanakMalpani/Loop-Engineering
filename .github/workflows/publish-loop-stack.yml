name: Publish le-loop-stack to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require PyPI API token
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        run: |
          echo "::error::PYPI_API_TOKEN is not set in repo Secrets → Actions."
          echo "Add an API token from https://pypi.org/manage/account/token/"
          echo "Or configure trusted publishing — see docs/maintainer/PYPI_PUBLISH.md"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build loopforge and loopctl (dependency resolution)
        run: |
          pip install build
          cp standards/schema/lss-1.0.schema.json loopforge/schemas/
          cp standards/schema/lss-1.1-composition.schema.json loopforge/schemas/
          cp standards/schema/loop-trace-1.0.schema.json loopctl/schemas/
          cp standards/examples/minimal-loop.yaml loopctl/schemas/
          python -m build loopforge
          python -m build loopctl
          pip install loopforge/dist/*.whl loopctl/dist/*.whl

      - name: Build le-loop-stack
        working-directory: stack
        run: python -m build

      - name: Publish le-loop-stack
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: stack/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
