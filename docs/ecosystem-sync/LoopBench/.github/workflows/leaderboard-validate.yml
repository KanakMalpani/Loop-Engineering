name: Validate entries

on:
  pull_request:
    paths:
      - leaderboard/entries.json
  push:
    branches: [main]
    paths:
      - leaderboard/entries.json

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install loopbench
        run: pip install -e . loopgym

      - name: Validate entries.json
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          from loopbench.conformance import validate_leaderboard
          board = json.loads(Path('leaderboard/entries.json').read_text())
          errors = validate_leaderboard(board)
          if errors:
              for e in errors[:20]:
                  print(e)
              sys.exit(1)
          print('OK: leaderboard validation passed')
          "

      - name: Render leaderboard
        run: |
          python scripts/render_leaderboard.py \
            --entries leaderboard/entries.json \
            --live-out /tmp/LIVE.md \
            --site-out /tmp/leaderboard.json \
            --top-n 20
