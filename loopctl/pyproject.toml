[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "le-loopctl"
version = "0.5.0"
description = "Unified CLI for Loop Engineering — validate, score, trace, pipeline, agents, bench"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Loop Engineering Community" }]
dependencies = [
    "le-loopforge>=0.5.0",
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
bench = ["loopbench>=0.1.1"]

[project.scripts]
loopctl = "loopctl.cli:main"

[project.urls]
Homepage = "https://github.com/KanakMalpani/Loop-Engineering"
Repository = "https://github.com/KanakMalpani/Loop-Engineering"

[tool.setuptools]
package-dir = { "loopctl" = ".", "loopctl.scoring" = "scoring" }
packages = ["loopctl", "loopctl.scoring"]

[tool.setuptools.package-data]
loopctl = ["schemas/*.json", "schemas/*.yaml"]
