loop_name: interview-coach
version: 1.0.0
objective: 'Prepare candidate via mock sessions and rubric-based iterative feedback. Achieve primary_quality
  >= 0.78 within cost_limits with zero safety violations.

  '
inputs:
  schema:
    task:
      type: string
      description: Primary task description or domain context
      required: true
  examples:
  - task: Complete the declared objective for this loop profile.
memory:
  type: ephemeral
workers:
- id: interviewer
  role: Conduct realistic mock interviews
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  inputs:
  - from: inputs.task
  outputs:
    name: InterviewerOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
- id: proctor
  role: Score responses against rubric
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  depends_on:
  - interviewer
  inputs:
  - from: inputs.task
  outputs:
    name: ProctorOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
- id: coach
  role: Deliver actionable feedback
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  depends_on:
  - proctor
  inputs:
  - from: inputs.task
  outputs:
    name: CoachOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
- id: drill_master
  role: Run rapid micro-drills on weak areas
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  depends_on:
  - coach
  inputs:
  - from: inputs.task
  outputs:
    name: DrillMasterOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
evaluators:
- id: rubric_score
  type: llm_rubric
  runs_after:
  - interviewer
  - proctor
  rubric:
    dimensions:
    - name: quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: Technical rubric scoring
    pass_threshold: 0.75
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
- id: behavioral_calibration
  type: llm_rubric
  runs_after:
  - interviewer
  - proctor
  rubric:
    dimensions:
    - name: quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: Behavioral dimension check
    pass_threshold: 0.75
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
- id: improvement_delta
  type: llm_rubric
  runs_after:
  - interviewer
  - proctor
  rubric:
    dimensions:
    - name: quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: Iteration-over-iteration improvement
    pass_threshold: 0.75
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
feedback_channels:
- id: quality_to_drill_master
  source: evaluators.rubric_score
  destination: workers.drill_master
  format: structured
  fields:
  - failure_codes
  - dimension_scores
  - remediation_hints
  max_tokens: 500
  when: score < pass_threshold
- id: quality_to_optimizer
  source: evaluators.rubric_score
  destination: optimization_strategy.prompt_refinement
  format: structured
  fields:
  - failure_codes
  - remediation_hints
  max_tokens: 200
optimization_strategy:
  type: prompt_refinement
  max_steps: 10
  config:
    refinement_target: workers.drill_master
  rollback:
    on_metric_drop: 0.05
    on_safety_failure: true
termination_conditions:
  success:
  - metric: primary_quality
    operator: gte
    value: 0.78
    consecutive: 1
  failure:
  - type: safety_violation
    action: halt
  - type: max_iterations
    value: 10
    action: halt
  stall:
  - metric: primary_quality
    window_iterations: 3
    min_improvement: 0.03
    action: halt
metrics:
- name: primary_quality
  primary: true
  definition: Weighted score from primary evaluator rubric
  source: evaluators.rubric_score
  unit: ratio
  target: 0.78
  regression_threshold: 0.05
- name: cost_usd
  definition: Total API spend per loop run
  source: telemetry.cost
  unit: usd
  target: 0.9
safety_constraints:
- id: injection-guard
  type: injection_detect
  scope: pre_worker
  applies_to:
  - interviewer
  - proctor
  - coach
  - drill_master
  action: quarantine
  severity: S1
  on_error: halt
  config:
    max_risk_score: 0.7
cost_limits:
  per_iteration_usd: 0.18
  cumulative_usd: 1.8
  token_soft_cap: 12000
  on_approach:
    threshold_percent: 80
    action: warn
  on_exceed:
    action: halt
metadata:
  taxonomy_level: 2
  les_estimate: 77
  worker_count: 4
  evaluator_count: 3
  enriched: 2026-06-17 architecture-aligned LSS 1.0
  schema_version: '1.1'
