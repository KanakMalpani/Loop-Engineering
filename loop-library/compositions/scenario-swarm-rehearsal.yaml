loop_name: scenario-swarm-rehearsal
version: 1.0.0

objective: >
  Rehearse a high-stakes decision by running parallel worldview branches (falsifier, evidence, operator) then merge into a forecast brief with dissent preserved.
  Achieve composite_quality >= 0.80 within cost_limits.

inputs:
  schema:
    task:
      type: string
      description: "Top-level task for the composed pipeline"
      required: true
  examples:
    - task: "Run the composed loop pipeline on this objective."

memory:
  type: ephemeral

workers:
  - id: orchestrator
    role: "Fan out scenario to parallel branch loops, collect outputs, and merge into a forecast brief"
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0.2
    inputs:
      - from: inputs.task
    outputs:
      name: OrchestratorOutput
      format: text
    timeout_seconds: 180
    retries: 1
    cost_budget_usd: 0.50

evaluators:
  - id: composite_gate
    type: llm_rubric
    runs_after: [orchestrator]
    rubric:
      dimensions:
        - name: pipeline_quality
          weight: 1.0
          scale: [0, 1]
          criteria: "Synthesize parallel branch outputs into a decision brief; preserve explicit dissent"
      pass_threshold: 0.80
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0

feedback_channels:
  - id: composite_to_orchestrator
    source: evaluators.composite_gate
    destination: workers.orchestrator
    format: structured
    fields: [failure_codes, dimension_scores, remediation_hints]
    max_tokens: 600
    when: "score < pass_threshold"

optimization_strategy:
  type: prompt_refinement
  max_steps: 14
  config:
    refinement_target: workers.orchestrator
  rollback:
    on_metric_drop: 0.05
    on_safety_failure: true

termination_conditions:
  success:
    - metric: composite_quality
      operator: gte
      value: 0.80
      consecutive: 1
  failure:
    - type: safety_violation
      action: halt
    - type: max_iterations
      value: 14
      action: halt

metrics:
  - name: composite_quality
    primary: true
    definition: "Product of child stage quality scores"
    source: evaluators.composite_gate
    unit: ratio
    target: 0.80
  - name: cost_usd
    definition: "Cumulative spend across all child loops"
    source: telemetry.cost
    unit: usd
    target: 4.80

safety_constraints:
  - id: composition-guard
    type: injection_detect
    scope: pre_worker
    applies_to: [orchestrator]
    action: quarantine
    severity: S1
    on_error: halt

cost_limits:
  per_iteration_usd: 0.57
  cumulative_usd: 8.00
  token_soft_cap: 20000
  on_exceed:
    action: halt

composition:
  type: parallel
  merge:
    strategy: consensus_rubric
    min_branches_pass: 2
    preserve_dissent: true
    synthesizer: workers.orchestrator
  children:
    - id: falsifier
      ref: ../startup-validator.yaml
      role: branch
      lens: "Pre-mortem branch: assume the plan FAILS. Design falsification experiments and kill criteria."
    - id: evidence
      ref: ../research-agent.yaml
      role: branch
      lens: "Evidence branch: gather sourced facts, counter-narratives, and uncertainty bounds."
    - id: operator
      ref: ../business-strategy-agent.yaml
      role: branch
      lens: "Operator branch: produce a 90-day action memo regardless of optimism level."
  adapters: []

metadata:
  taxonomy_level: 4
  les_estimate: 83
  composition_type: parallel
  child_loops: ['falsifier', 'evidence', 'operator']
  lss_extension: "1.1-composition-draft"
