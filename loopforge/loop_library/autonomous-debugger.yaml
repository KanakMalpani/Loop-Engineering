loop_name: autonomous-debugger
version: 1.0.0
objective: 'Repair failing tests with minimal, reviewable diffs via reproduce-diagnose-patch-verify. Achieve
  primary_quality >= 0.85 within cost_limits with zero safety violations.

  '
inputs:
  schema:
    task:
      type: string
      description: Primary task description or domain context
      required: true
  examples:
  - task: Complete the declared objective for this loop profile.
memory:
  type: ephemeral
workers:
- id: reproducer
  role: Confirm failure reproduces deterministically
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  inputs:
  - from: inputs.task
  outputs:
    name: ReproducerOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
- id: diagnostician
  role: Rank root-cause hypotheses from traces
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  depends_on:
  - reproducer
  inputs:
  - from: inputs.task
  outputs:
    name: DiagnosticianOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
- id: patcher
  role: Apply minimal diff addressing root cause
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  depends_on:
  - diagnostician
  inputs:
  - from: inputs.task
  outputs:
    name: PatcherOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
- id: verifier
  role: Reject symptom fixes; require full suite pass
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  depends_on:
  - patcher
  inputs:
  - from: inputs.task
  outputs:
    name: VerifierOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
evaluators:
- id: repro_oracle
  type: llm_rubric
  runs_after:
  - reproducer
  - diagnostician
  rubric:
    dimensions:
    - name: quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: Failure reproduces before diagnose
    pass_threshold: 0.75
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
- id: test_suite
  type: llm_rubric
  runs_after:
  - reproducer
  - diagnostician
  rubric:
    dimensions:
    - name: quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: Full test suite pass
    pass_threshold: 0.75
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
- id: patch_budget
  type: llm_rubric
  runs_after:
  - reproducer
  - diagnostician
  rubric:
    dimensions:
    - name: quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: Diff size within budget
    pass_threshold: 0.75
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
- id: regression_guard
  type: llm_rubric
  runs_after:
  - reproducer
  - diagnostician
  rubric:
    dimensions:
    - name: quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: No unrelated file changes
    pass_threshold: 0.75
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
feedback_channels:
- id: quality_to_verifier
  source: evaluators.repro_oracle
  destination: workers.verifier
  format: structured
  fields:
  - failure_codes
  - dimension_scores
  - remediation_hints
  max_tokens: 500
  when: score < pass_threshold
- id: quality_to_optimizer
  source: evaluators.repro_oracle
  destination: optimization_strategy.prompt_refinement
  format: structured
  fields:
  - failure_codes
  - remediation_hints
  max_tokens: 200
optimization_strategy:
  type: prompt_refinement
  max_steps: 15
  config:
    refinement_target: workers.verifier
  rollback:
    on_metric_drop: 0.05
    on_safety_failure: true
termination_conditions:
  success:
  - metric: primary_quality
    operator: gte
    value: 0.85
    consecutive: 1
  failure:
  - type: safety_violation
    action: halt
  - type: max_iterations
    value: 15
    action: halt
  stall:
  - metric: primary_quality
    window_iterations: 3
    min_improvement: 0.03
    action: halt
metrics:
- name: primary_quality
  primary: true
  definition: Weighted score from primary evaluator rubric
  source: evaluators.repro_oracle
  unit: ratio
  target: 0.85
  regression_threshold: 0.05
- name: cost_usd
  definition: Total API spend per loop run
  source: telemetry.cost
  unit: usd
  target: 1.75
safety_constraints:
- id: injection-guard
  type: injection_detect
  scope: pre_worker
  applies_to:
  - reproducer
  - diagnostician
  - patcher
  - verifier
  action: quarantine
  severity: S1
  on_error: halt
  config:
    max_risk_score: 0.7
cost_limits:
  per_iteration_usd: 0.23
  cumulative_usd: 3.5
  token_soft_cap: 12000
  on_approach:
    threshold_percent: 80
    action: warn
  on_exceed:
    action: halt
metadata:
  taxonomy_level: 3
  les_estimate: 85
  worker_count: 4
  evaluator_count: 4
  enriched: 2026-06-17 architecture-aligned LSS 1.0
  schema_version: '1.1'
