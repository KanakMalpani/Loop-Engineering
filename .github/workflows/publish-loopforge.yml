name: Publish loopforge to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish (e.g. 0.1.0)
        required: true
        default: "0.1.0"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require PyPI API token
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        run: |
          echo "::error::PYPI_API_TOKEN is not set in repo Secrets → Actions."
          echo "Add an API token from https://pypi.org/manage/account/token/"
          echo "Or configure trusted publishing — see docs/maintainer/PYPI_PUBLISH.md"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync schema bundles
        run: |
          cp standards/schema/lss-1.0.schema.json loopforge/schemas/
          cp standards/schema/lss-1.1-composition.schema.json loopforge/schemas/

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        working-directory: loopforge
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: loopforge/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
