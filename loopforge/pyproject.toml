[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "le-loopforge"
version = "0.2.1"
description = "Scaffold valid LSS loop specifications from common patterns"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Loop Engineering Community" }]
keywords = ["loop-engineering", "lss", "agents", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
]

[project.scripts]
loopforge = "loopforge.__main__:main"

[project.urls]
Homepage = "https://github.com/KanakMalpani/Loop-Engineering"
Documentation = "https://github.com/KanakMalpani/Loop-Engineering/blob/main/All%20about%20loops/LOOP_FORGE.md"
Repository = "https://github.com/KanakMalpani/Loop-Engineering"

[tool.setuptools]
package-dir = { "loopforge" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["loopforge*"]

[tool.setuptools.package-data]
loopforge = ["schemas/*.json", "templates/export/**/*"]
