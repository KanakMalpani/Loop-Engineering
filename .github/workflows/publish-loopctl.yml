name: Publish loopctl to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

# Token auth only — do not set id-token: write unless PyPI trusted publishing
# is configured for this repo/workflow (see docs/maintainer/PYPI_PUBLISH.md).
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Require PyPI API token
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        run: |
          echo "::error::PYPI_API_TOKEN is not set in repo Secrets → Actions."
          echo "Add an API token from https://pypi.org/manage/account/token/"
          echo "Or configure trusted publishing — see docs/maintainer/PYPI_PUBLISH.md"
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync schemas
        run: |
          mkdir -p loopctl/schemas
          cp standards/schema/loop-trace-1.0.schema.json loopctl/schemas/
          cp standards/examples/minimal-loop.yaml loopctl/schemas/

      - name: Build loopforge first (dependency)
        working-directory: loopforge
        run: |
          pip install build
          cp ../standards/schema/lss-1.0.schema.json schemas/ || true
          cp ../standards/schema/lss-1.1-composition.schema.json schemas/ || true
          python -m build
          pip install dist/*.whl

      - name: Build loopctl
        working-directory: loopctl
        run: |
          pip install build
          python -m build

      - name: Publish loopctl
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: loopctl/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
