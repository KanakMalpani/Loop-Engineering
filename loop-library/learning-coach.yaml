loop_name: learning-coach
version: 1.0.0

objective: >
  Guide learner to demonstrable mastery via adaptive instruction and verified assessments.
  Achieve primary_quality >= 0.80 within cost_limits with zero safety violations.

inputs:
  schema:
    task:
      type: string
      description: "Primary task description or domain context"
      required: true
  examples:
    - task: "Complete the declared objective for this loop profile."

memory:
  type: ephemeral

workers:
  - id: diagnostician
    role: "Estimate learner knowledge state"
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0.2
    inputs:
      - from: inputs.task
    outputs:
      name: DiagnosticianOutput
      format: text
    timeout_seconds: 120
    retries: 1
    cost_budget_usd: 0.30
  - id: instructor
    role: "Deliver adaptive instruction"
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0.2
    depends_on: [diagnostician]
    inputs:
      - from: inputs.task
    outputs:
      name: InstructorOutput
      format: text
    timeout_seconds: 120
    retries: 1
    cost_budget_usd: 0.30
  - id: exercise_generator
    role: "Generate spaced practice items"
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0.2
    depends_on: [instructor]
    inputs:
      - from: inputs.task
    outputs:
      name: ExerciseGeneratorOutput
      format: text
    timeout_seconds: 120
    retries: 1
    cost_budget_usd: 0.30
  - id: reflector
    role: "Summarize session progress"
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0.2
    depends_on: [exercise_generator]
    inputs:
      - from: inputs.task
    outputs:
      name: ReflectorOutput
      format: text
    timeout_seconds: 120
    retries: 1
    cost_budget_usd: 0.30

evaluators:
  - id: mastery_probe
    type: llm_rubric
    runs_after: [diagnostician, instructor]
    rubric:
      dimensions:
        - name: quality
          weight: 1.0
          scale: [0, 1]
          criteria: "Mastery assessment oracle"
      pass_threshold: 0.75
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0
  - id: retention_check
    type: llm_rubric
    runs_after: [diagnostician, instructor]
    rubric:
      dimensions:
        - name: quality
          weight: 1.0
          scale: [0, 1]
          criteria: "Retention verification"
      pass_threshold: 0.75
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0
  - id: pedagogy_rubric
    type: llm_rubric
    runs_after: [diagnostician, instructor]
    rubric:
      dimensions:
        - name: quality
          weight: 1.0
          scale: [0, 1]
          criteria: "Instruction quality rubric"
      pass_threshold: 0.75
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0

feedback_channels:
  - id: quality_to_reflector
    source: evaluators.mastery_probe
    destination: workers.reflector
    format: structured
    fields: [failure_codes, dimension_scores, remediation_hints]
    max_tokens: 500
    when: "score < pass_threshold"
  - id: quality_to_optimizer
    source: evaluators.mastery_probe
    destination: optimization_strategy.prompt_refinement
    format: structured
    fields: [failure_codes, remediation_hints]
    max_tokens: 200

optimization_strategy:
  type: prompt_refinement
  max_steps: 12
  config:
    refinement_target: workers.reflector
  rollback:
    on_metric_drop: 0.05
    on_safety_failure: true

termination_conditions:
  success:
    - metric: primary_quality
      operator: gte
      value: 0.80
      consecutive: 1
  failure:
    - type: safety_violation
      action: halt
    - type: max_iterations
      value: 12
      action: halt
  stall:
    - metric: primary_quality
      window_iterations: 3
      min_improvement: 0.03
      action: halt

metrics:
  - name: primary_quality
    primary: true
    definition: "Weighted score from primary evaluator rubric"
    source: evaluators.mastery_probe
    unit: ratio
    target: 0.80
    regression_threshold: 0.05
  - name: cost_usd
    definition: "Total API spend per loop run"
    source: telemetry.cost
    unit: usd
    target: 0.75

safety_constraints:
  - id: injection-guard
    type: injection_detect
    scope: pre_worker
    applies_to: [diagnostician, instructor, exercise_generator, reflector]
    action: quarantine
    severity: S1
    on_error: halt
    config:
      max_risk_score: 0.7

cost_limits:
  per_iteration_usd: 0.12
  cumulative_usd: 1.50
  token_soft_cap: 12000
  on_approach:
    threshold_percent: 80
    action: warn
  on_exceed:
    action: halt

metadata:
  taxonomy_level: 2
  les_estimate: 80
  worker_count: 4
  evaluator_count: 3
  enriched: "2026-06-17 architecture-aligned LSS 1.0"
