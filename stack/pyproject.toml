[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "le-loop-stack"
version = "0.4.0"
description = "Everything for loop engineering — forge, score, run, benchmark, agent bridges"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Loop Engineering Community" }]
keywords = ["loop-engineering", "lss", "agents", "langgraph", "crewai", "meta-package"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "le-loopforge>=0.5.0",
    "le-loopctl>=0.5.0",
    "loopgym>=0.1.3",
    "loopbench>=0.2.0",
]

[project.optional-dependencies]
math = ["loopmath>=0.1.0"]
langgraph = ["langgraph>=0.2.0"]
crewai = ["crewai>=0.1.0"]
agents = ["langgraph>=0.2.0", "crewai>=0.1.0"]
bench = ["loopbench>=0.2.0"]
all = ["langgraph>=0.2.0", "crewai>=0.1.0", "loopbench>=0.2.0", "loopmath>=0.1.0"]

[project.scripts]
loop = "loopctl.cli:main"
loopctl = "loopctl.cli:main"

[project.urls]
Homepage = "https://github.com/KanakMalpani/Loop-Engineering"
Documentation = "https://github.com/KanakMalpani/Loop-Engineering/blob/main/contributions/GOLDEN_PATH.md"
Repository = "https://github.com/KanakMalpani/Loop-Engineering/tree/main/stack"

[tool.setuptools]
packages = []
