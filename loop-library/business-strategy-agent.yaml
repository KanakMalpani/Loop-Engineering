loop_name: business-strategy-agent
version: 1.0.0
objective: 'Produce decision-ready strategy memo with ranked options and red-team challenges. Achieve
  primary_quality >= 0.82 within cost_limits with zero safety violations.

  '
inputs:
  schema:
    task:
      type: string
      description: Primary task description or domain context
      required: true
  examples:
  - task: Complete the declared objective for this loop profile.
memory:
  type: ephemeral
workers:
- id: strategist
  role: Generate ranked strategic options
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  inputs:
  - from: inputs.task
  outputs:
    name: StrategistOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
- id: financial_modeler
  role: Quantify scenario outcomes
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  depends_on:
  - strategist
  inputs:
  - from: inputs.task
  outputs:
    name: FinancialModelerOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
- id: red_team
  role: Adversarial challenge of assumptions
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  depends_on:
  - strategist
  inputs:
  - from: inputs.task
  outputs:
    name: RedTeamOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
- id: synthesizer
  role: Merge into decision memo
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0.2
  depends_on:
  - financial_modeler
  - red_team
  inputs:
  - from: inputs.task
  outputs:
    name: SynthesizerOutput
    format: text
  timeout_seconds: 120
  retries: 1
  cost_budget_usd: 0.3
evaluators:
- id: scenario_stress
  type: llm_rubric
  runs_after:
  - strategist
  - financial_modeler
  rubric:
    dimensions:
    - name: quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: Scenario stress tests
    pass_threshold: 0.75
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
- id: kpi_alignment
  type: llm_rubric
  runs_after:
  - strategist
  - financial_modeler
  rubric:
    dimensions:
    - name: quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: KPI alignment rubric
    pass_threshold: 0.75
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
- id: assumption_audit
  type: llm_rubric
  runs_after:
  - strategist
  - financial_modeler
  rubric:
    dimensions:
    - name: quality
      weight: 1.0
      scale:
      - 0
      - 1
      criteria: Explicit assumption tracking
    pass_threshold: 0.75
  model:
    provider: openai
    name: gpt-4.1-mini
    temperature: 0
feedback_channels:
- id: quality_to_synthesizer
  source: evaluators.scenario_stress
  destination: workers.synthesizer
  format: structured
  fields:
  - failure_codes
  - dimension_scores
  - remediation_hints
  max_tokens: 500
  when: score < pass_threshold
- id: quality_to_optimizer
  source: evaluators.scenario_stress
  destination: optimization_strategy.prompt_refinement
  format: structured
  fields:
  - failure_codes
  - remediation_hints
  max_tokens: 200
optimization_strategy:
  type: prompt_refinement
  max_steps: 10
  config:
    refinement_target: workers.synthesizer
  rollback:
    on_metric_drop: 0.05
    on_safety_failure: true
termination_conditions:
  success:
  - metric: primary_quality
    operator: gte
    value: 0.82
    consecutive: 1
  failure:
  - type: safety_violation
    action: halt
  - type: max_iterations
    value: 10
    action: halt
  stall:
  - metric: primary_quality
    window_iterations: 3
    min_improvement: 0.03
    action: halt
metrics:
- name: primary_quality
  primary: true
  definition: Weighted score from primary evaluator rubric
  source: evaluators.scenario_stress
  unit: ratio
  target: 0.82
  regression_threshold: 0.05
- name: cost_usd
  definition: Total API spend per loop run
  source: telemetry.cost
  unit: usd
  target: 2.0
safety_constraints:
- id: injection-guard
  type: injection_detect
  scope: pre_worker
  applies_to:
  - strategist
  - financial_modeler
  - red_team
  - synthesizer
  action: quarantine
  severity: S1
  on_error: halt
  config:
    max_risk_score: 0.7
cost_limits:
  per_iteration_usd: 0.4
  cumulative_usd: 4.0
  token_soft_cap: 12000
  on_approach:
    threshold_percent: 80
    action: warn
  on_exceed:
    action: halt
metadata:
  taxonomy_level: 3
  les_estimate: 76
  worker_count: 4
  evaluator_count: 3
  enriched: 2026-06-17 architecture-aligned LSS 1.0
  schema_version: '1.1'
