loop_name: circuit-design-agent
version: 1.0.0

objective: >
  Design circuit meeting specs verified by simulation and design rule checks.
  Achieve primary_quality >= 0.80 within cost_limits with zero safety violations.

inputs:
  schema:
    task:
      type: string
      description: "Primary task description or domain context"
      required: true
  examples:
    - task: "Complete the declared objective for this loop profile."

memory:
  type: ephemeral

workers:
  - id: architect
    role: "Select topology meeting electrical specs"
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0.2
    inputs:
      - from: inputs.task
    outputs:
      name: ArchitectOutput
      format: text
    timeout_seconds: 120
    retries: 1
    cost_budget_usd: 0.30
  - id: simulator
    role: "Run SPICE simulation and extract metrics"
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0.2
    depends_on: [architect]
    inputs:
      - from: inputs.task
    outputs:
      name: SimulatorOutput
      format: text
    timeout_seconds: 120
    retries: 1
    cost_budget_usd: 0.30
  - id: layout_advisor
    role: "Assess layout parasitics and DRC feasibility"
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0.2
    depends_on: [simulator]
    inputs:
      - from: inputs.task
    outputs:
      name: LayoutAdvisorOutput
      format: text
    timeout_seconds: 120
    retries: 1
    cost_budget_usd: 0.30
  - id: optimizer
    role: "Tune parameters toward spec targets"
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0.2
    depends_on: [layout_advisor]
    inputs:
      - from: inputs.task
    outputs:
      name: OptimizerOutput
      format: text
    timeout_seconds: 120
    retries: 1
    cost_budget_usd: 0.30

evaluators:
  - id: spice_oracle
    type: llm_rubric
    runs_after: [architect, simulator]
    rubric:
      dimensions:
        - name: quality
          weight: 1.0
          scale: [0, 1]
          criteria: "SPICE metric compliance"
      pass_threshold: 0.75
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0
  - id: drc_check
    type: llm_rubric
    runs_after: [architect, simulator]
    rubric:
      dimensions:
        - name: quality
          weight: 1.0
          scale: [0, 1]
          criteria: "Design rule check gate"
      pass_threshold: 0.75
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0
  - id: spec_margin
    type: llm_rubric
    runs_after: [architect, simulator]
    rubric:
      dimensions:
        - name: quality
          weight: 1.0
          scale: [0, 1]
          criteria: "Operating margin rubric"
      pass_threshold: 0.75
    model:
      provider: openai
      name: gpt-4.1-mini
      temperature: 0

feedback_channels:
  - id: quality_to_optimizer
    source: evaluators.spice_oracle
    destination: workers.optimizer
    format: structured
    fields: [failure_codes, dimension_scores, remediation_hints]
    max_tokens: 500
    when: "score < pass_threshold"
  - id: quality_to_optimizer
    source: evaluators.spice_oracle
    destination: optimization_strategy.prompt_refinement
    format: structured
    fields: [failure_codes, remediation_hints]
    max_tokens: 200

optimization_strategy:
  type: prompt_refinement
  max_steps: 15
  config:
    refinement_target: workers.optimizer
  rollback:
    on_metric_drop: 0.05
    on_safety_failure: true

termination_conditions:
  success:
    - metric: primary_quality
      operator: gte
      value: 0.80
      consecutive: 1
  failure:
    - type: safety_violation
      action: halt
    - type: max_iterations
      value: 15
      action: halt
  stall:
    - metric: primary_quality
      window_iterations: 3
      min_improvement: 0.03
      action: halt

metrics:
  - name: primary_quality
    primary: true
    definition: "Weighted score from primary evaluator rubric"
    source: evaluators.spice_oracle
    unit: ratio
    target: 0.80
    regression_threshold: 0.05
  - name: cost_usd
    definition: "Total API spend per loop run"
    source: telemetry.cost
    unit: usd
    target: 3.00

safety_constraints:
  - id: injection-guard
    type: injection_detect
    scope: pre_worker
    applies_to: [architect, simulator, layout_advisor, optimizer]
    action: quarantine
    severity: S1
    on_error: halt
    config:
      max_risk_score: 0.7

cost_limits:
  per_iteration_usd: 0.40
  cumulative_usd: 6.00
  token_soft_cap: 12000
  on_approach:
    threshold_percent: 80
    action: warn
  on_exceed:
    action: halt

metadata:
  taxonomy_level: 3
  les_estimate: 73
  worker_count: 4
  evaluator_count: 3
  enriched: "2026-06-17 architecture-aligned LSS 1.0"
