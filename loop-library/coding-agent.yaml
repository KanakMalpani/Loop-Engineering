# LSS 1.0 — Coding Agent Loop
# Taxonomy Level 3 (Multi-Agent): implementer + reviewer + test oracle

loop_name: coding-agent
version: "1.0"

objective: >
  Implement a specified software change in an existing codebase such that all
  declared tests pass, static analysis is clean, and the diff stays within scope.
  The loop terminates on green CI-equivalent checks or bounded failure with
  diagnostic artifact.

inputs:
  - name: task_spec
    type: string
    required: true
    description: Feature or fix description with acceptance criteria
  - name: repository_root
    type: path
    required: true
  - name: test_command
    type: string
    default: pytest -q
  - name: lint_command
    type: string
    default: ruff check .
  - name: allowed_paths
    type: array
    items: path
    description: Glob patterns for files the implementer may modify
  - name: forbidden_paths
    type: array
    items: path
    default: [".env", "secrets/**", "**/migrations/*.sql"]
  - name: max_diff_lines
    type: integer
    default: 400

memory:
  episodic:
    backend: file_artifact
    retention: session
    stores: [test_logs, lint_output, diff_snapshots, reviewer_comments]
  semantic:
    backend: code_index
    retention: persistent
    stores: [symbol_graph, import_map, test_coverage_map]
  procedural:
    backend: key_value
    retention: persistent
    stores: [repo_conventions, prior_fix_patterns, flaky_test_registry]

workers:
  - id: architect
    role: planner
    model: claude-sonnet-4-6
    temperature: 0.2
    responsibilities:
      - Produce implementation plan with file touch list
      - Identify test gaps before coding begins
  - id: implementer
    role: coder
    model: gpt-5.3-codex
    temperature: 0.1
    tools: [read_file, write_file, search_replace, run_terminal]
    responsibilities:
      - Apply minimal diff satisfying task_spec
      - Run test_command after each logical change
  - id: reviewer
    role: checker
    model: claude-sonnet-4-6
    temperature: 0.0
    responsibilities:
      - Review diff for scope creep, security smells, and convention violations
      - Block merge-equivalent state until issues resolved

evaluators:
  - id: test_suite
    type: command
    command: "${inputs.test_command}"
    pass_condition: exit_code == 0
  - id: linter
    type: command
    command: "${inputs.lint_command}"
    pass_condition: exit_code == 0
  - id: diff_budget
    type: metric
    metric: total_changed_lines
    operator: lte
    value: "${inputs.max_diff_lines}"
  - id: scope_guard
    type: path_allowlist
    allowed: "${inputs.allowed_paths}"
    forbidden: "${inputs.forbidden_paths}"

feedback_channels:
  - from: test_suite
    to: implementer
    signal: failing_tests_with_tracebacks
    action: fix_implementation
  - from: linter
    to: implementer
    signal: lint_violations
    action: style_and_safety_fixes
  - from: reviewer
    to: architect
    signal: design_objections
    action: revise_plan
  - from: scope_guard
    to: implementer
    signal: out_of_scope_edits
    action: revert_and_narrow

optimization_strategy:
  type: maker_checker_cycle
  parameters:
    implement_before_review: true
    max_review_rounds: 4
    prefer_smallest_passing_diff: true
    rollback_on_test_regression: true

termination_conditions:
  - type: all_evaluators_pass
    evaluators: [test_suite, linter, diff_budget, scope_guard]
  - type: max_iterations
    value: 12
  - type: unrecoverable_failure
    condition: same_test_fails >= 3
    action: emit_diagnostic_report
  - type: budget_exhausted
    resource: cost_limits.max_usd

metrics:
  - name: test_pass_rate
    formula: passing_tests / total_tests
    target: 1.0
  - name: diff_efficiency
    formula: task_completion / lines_changed
  - name: iterations_to_green
    unit: count
    target: 4
  - name: review_block_rate
    formula: reviewer_blocks / review_rounds

safety_constraints:
  - id: no_secret_commits
    rule: Reject diffs touching forbidden_paths or containing credential patterns
  - id: no_arbitrary_exec
    rule: run_terminal limited to test, lint, and build commands on allowlist
  - id: dependency_pinning
    rule: New dependencies require explicit approval flag in inputs
  - id: destructive_ops
    rule: Block rm -rf, git reset --hard, and database drop commands

cost_limits:
  max_usd: 5.00
  max_tokens: 200000
  max_wall_clock_seconds: 1800
  per_worker_caps:
    implementer: 3.00
    reviewer: 1.50
