name: Validate loop-library

on:
  push:
    branches: [main]
    paths:
      - 'loop-library/**'
      - 'standards/schema/**'
      - 'scripts/validate_loop_library.py'
      - 'tools/composition_validator.py'
      - 'implementations/generic/composed_runtime.py'
      - 'examples/compose-loop/**'
      - '.github/workflows/validate-loop-library.yml'
  pull_request:
    paths:
      - 'loop-library/**'
      - 'standards/schema/**'
      - 'scripts/validate_loop_library.py'
      - 'tools/composition_validator.py'
      - 'implementations/generic/composed_runtime.py'
      - 'examples/compose-loop/**'
      - '.github/workflows/validate-loop-library.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate atomic and composed specs
        run: python scripts/validate_loop_library.py

      - name: Smoke test reflection-loop
        run: python examples/reflection-loop/run.py

      - name: Smoke test composed loop (nested)
        run: python examples/compose-loop/run.py loop-library/compositions/code-debug-repair.yaml
